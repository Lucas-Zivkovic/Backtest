[project]
name = "backtest"
version = "0.1.0"
description = "Event-driven backtesting engine and research on momentum, mean reversion and pair trading for US equities"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas>=2.1",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
    "pandas-datareader>=0.10.0",
    "requests>=2.31",
    "lxml>=4.9",
    "hmmlearn>=0.3.0",
    "python-kraken-sdk>=1.6.2",
    "ib-async>=1.0 ; python_full_version >= '3.10'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "setuptools<81",
]

[tool.pytest.ini_options]
markers = [
    "realdata: downloads market data (Yahoo Finance, Wikipedia, Ken French) or reads the local cache; slow",
]
